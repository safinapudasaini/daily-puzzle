<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
  </defs>

  <!-- Banana Icon Graphic -->
  <g transform="translate(10, 5)">
    <!-- Banana Body -->
    <path d="M 8 36 C 14 46, 32 48, 44 38 C 42 26, 28 12, 10 10 C 6 18, 5 28, 8 36 Z" 
          fill="url(#bananaGrad)" stroke="#A16207" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Banana Curve Ridge -->
    <path d="M 12 18 C 24 24, 34 32, 40 37" 
          fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Stem -->
    <path d="M 9 10 C 8 6, 12 4, 15 5 C 13 8, 11 9, 9 10 Z" 
          fill="url(#stemGrad)" stroke="#365314" stroke-width="1"/>
    <!-- Tip -->
    <circle cx="43" cy="38" r="2.2" fill="#78350F"/>
    <!-- Math Quiz Sparkles -->
    <path d="M 38 10 L 40 14 L 44 16 L 40 18 L 38 22 L 36 18 L 32 16 L 36 14 Z" fill="#F59E0B"/>
    <circle cx="28" cy="8" r="1.5" fill="#EAB308"/>
  </g>

  <!-- Brand Typography -->
  <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1E293B" letter-spacing="-0.5">
    BANANA<tspan fill="#EAB308">QUIZ</tspan>
  </text>
  <text x="67" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.2">
    MATH PUZZLE ENTERPRISE
  </text>
</svg>
